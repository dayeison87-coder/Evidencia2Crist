name: CI/CD Pipeline - DevSecOps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Pruebas Unitarias
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest
        run: pytest -v app/test_app.py

  # 2. Análisis de Seguridad
  bandit-sast:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -r . -x ./tests -lll -iii

  # 3. Análisis de Vulnerabilidades
  trivy-scan:
    needs: bandit-sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build local Docker image
        run: docker build -t evidencia2crist-api:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'evidencia2crist-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # 4. Despliegue en Servidor
  deploy:
    needs: [test, bandit-sast, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH 
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TARGET_DIR="~/npm"
            
            if [ ! -d "$TARGET_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git $TARGET_DIR
              cd $TARGET_DIR
            else
              cd $TARGET_DIR
              git pull origin main
            fi

            docker compose up -d --build